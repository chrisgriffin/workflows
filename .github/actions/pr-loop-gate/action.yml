name: PR loop gate
description: >
  The PR review loop's dispatcher (chrisgriffin/ops#1164). Reads the loop's
  state blocks on a PR, writes the required `Evaluator` commit status, and
  starts the Evaluator or Autofix routine through its API trigger when the
  phase owes one. The logic is the gate script in chrisgriffin/ops, checked
  out here at `develop` with a token that can read that repo: a public caller
  cannot `uses:` an action hosted in a private repo, but a job holding a
  token can clone one, so the script keeps its one home and merging there is
  still the fleet-wide deploy.

inputs:
  github-token:
    description: The caller's GITHUB_TOKEN (statuses write, issues write).
    required: true
  evaluator-fire-token:
    description: The Evaluator routine's API-trigger token (EVALUATOR_FIRE_TOKEN).
    required: false
    default: ""
  autofix-fire-token:
    description: The Autofix routine's API-trigger token (AUTOFIX_FIRE_TOKEN).
    required: false
    default: ""
  ops-token:
    description: >-
      A token with contents read on chrisgriffin/ops (OPS_GH_TOKEN, or
      TARGET_TOKEN in ops itself), used only to check the gate script out.
    required: true
  target-token:
    description: >-
      A user token with pull-request write on the caller (TARGET_TOKEN: ops's
      own, or a target's RELEASE_PR_TOKEN passed under that key). The gate replies on inline finding
      threads and resolves them with it, which the Actions token may not
      do (ops#1914, ops#1919). Empty: the reply posts as the Actions token
      and the thread stays open.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Require the token that reads the gate script
      shell: bash
      env:
        OPS_TOKEN: ${{ inputs.ops-token }}
      run: |
        if [ -z "${OPS_TOKEN:-}" ]; then
          echo "::error::OPS_GH_TOKEN is not set on this repo, so the gate cannot read its script out of chrisgriffin/ops. Add a token with contents read on that repo as a repository secret."
          exit 1
        fi
    # No `actions/checkout` of the CALLER: the gate reads the event payload
    # and the GitHub API, never the caller's tree (ADR-017).
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        repository: chrisgriffin/ops
        ref: develop
        token: ${{ inputs.ops-token }}
        path: .pr-loop-gate
        persist-credentials: false
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version: 22
    - name: Gate the PR
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        EVALUATOR_FIRE_TOKEN: ${{ inputs.evaluator-fire-token }}
        AUTOFIX_FIRE_TOKEN: ${{ inputs.autofix-fire-token }}
        TARGET_TOKEN: ${{ inputs.target-token }}
      run: node .pr-loop-gate/pr-loop/gate.mjs
