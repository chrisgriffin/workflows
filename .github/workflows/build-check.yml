name: build

# This repo's CI: every workflow and action here is valid GitHub Actions
# syntax, with shellcheck over every `run:` block, then the suite under
# test/ runs each body's shell against fixtures (README § Tests). A plain
# job rather than a call of _reusable-node-ci.yml: it is two steps, and the
# body it would call is one of the files under test. The job's `name:` is
# `build / ci`, the check every target's ruleset requires: a plain job's
# check-run carries the job name alone, never `<workflow> / <job>`; only a
# `uses:` call reports as `<caller job> / <callee job>`.
#
# actionlint is downloaded as a release tarball pinned to an exact version
# and verified against that release's published sha256 before it runs, so
# nothing executes from a moving ref. Bump both lines together.

on:
  push:
    branches: [develop]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  ci:
    name: build / ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          curl -sSfL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -version

      - name: Lint every workflow
        run: ./actionlint -color -shellcheck=shellcheck .github/workflows/*.yml

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Run every body's shell against fixtures
        run: npm test
