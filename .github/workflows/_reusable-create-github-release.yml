name: Create GitHub Release (reusable)

# The seventh workflow to move into ops as a `workflow_call` body, joining the
# six in README.md § Target-side workflow files. Same reason as
# `_reusable-release-pr.yml`: this is each repo's own release automation, not
# operator integration, and it had forked three ways while doing one job.
#
# Fires (via each target's stub) when a `release/*` PR opened by
# release-pr.yml is merged into main — the real release gate, a human click.
# Reads the version from package.json at the merge commit, lifts that
# version's section out of CHANGELOG.md, and creates the GitHub Release+tag.
#
# What varied across the three copies, and how it is expressed here:
#
#   a site        nothing — checkout, read version, cut notes, release.
#                 That bare path is what every input below defaults to.
#   an extension  builds and packages a .vsix first, then attaches it to
#                 the release  -> `build_command` + `release_assets`.
#   a package     publishes to GitHub Packages immediately after, in the
#                 SAME job                              -> `npm_registry_url`.
#
# That last one is load-bearing and must not be "tidied" into a separate
# workflow reacting to `release: published`: a release created with
# GITHUB_TOKEN does not trigger downstream workflows (GitHub's recursion
# guard), so the chained publish would silently never fire. Publishing as the
# next step in this same job is what sidesteps it.
#
# The changelog matcher is `/^###? \[?v?[0-9]/`, not two of the copies'
# old `/^## \[/` and not the bare `/^## /` this carried until ops#412. It
# matches the bracketed `## [2.2.1](compare-link) (date)` form all three
# reusable-workflow callers generate, a hand-written bare `## v1.4.0`, and
# a `###` heading if the preset ever emits one — while still never matching a
# section heading like `### Bug Fixes`, because a version token must follow
# the hashes. The level is deliberately not assumed: this file overrides only
# types/transform/formatDate, never writer.headerPartial, so the heading level
# belongs to the preset and can change under us. Which form a repo gets
# depends only on its changelog preset — and now that every target generates
# its CHANGELOG through the shared `_reusable-release-pr.yml`, hardcoding
# either spelling is a latent empty-release-notes bug waiting for a preset
# change. `### Bug Fixes` sub-headers do not match — not because of the hash
# count, which now permits three, but because the required version token
# (`[`, `v`, or a digit) never follows them. That is what keeps the awk range
# scoped to exactly one version's section.

on:
  workflow_call:
    inputs:
      node_version:
        description: Node version used for the build/publish steps.
        required: false
        type: string
        default: "22"
      build_command:
        description: >-
          Shell run after checkout and before the release is created — for a
          target that must produce an artifact to attach. Empty (the default)
          skips the step entirely.
        required: false
        type: string
        default: ""
      release_assets:
        description: >-
          Glob of files to attach to the release, e.g. `./*.vsix`. Empty (the
          default) creates a release with no attached files.
        required: false
        type: string
        default: ""
      npm_registry_url:
        description: >-
          When set, `npm publish` runs against this registry immediately after
          the release is created, in the same job. Empty (the default)
          publishes nothing.
        required: false
        type: string
        default: ""
      npm_scope:
        description: Package scope used when npm_registry_url is set.
        required: false
        type: string
        default: "@chrisgriffin"
      marketplace_packages:
        description: >-
          Glob of packaged VS Code extensions (`./*.vsix`), matched against
          the Release's own assets, to publish after the release to the VS
          Code Marketplace with the caller's `VSCE_PAT` secret and to Open
          VSX with its `OVSX_PAT` secret, or with trusted publishing when it
          passes none and grants `id-token: write`. Empty (the default)
          publishes nothing.
        required: false
        type: string
        default: ""
      floating_major_tag:
        description: >-
          Also move the floating major tag (`v1` for a `v1.4.2` release) to
          the released commit, creating it on the first release of that
          major. For a repo other workflows `uses:` by tag, so a caller
          written `@v1` follows every release of the major. Off (the
          default) touches no tag but the version's own.
        required: false
        type: boolean
        default: false
    secrets:
      VSCE_PAT:
        description: >-
          The VS Code Marketplace publisher token, a global Azure DevOps PAT,
          read only when `marketplace_packages` is set. A caller publishing
          nothing passes nothing. Microsoft retires global PATs on
          2026-12-01 (README).
        required: false
      OVSX_PAT:
        description: >-
          An Open VSX (open-vsx.org) access token, read only when
          `marketplace_packages` is set. Its namespace must already exist and
          match the extension's publisher. A caller publishing nothing, or
          publishing with trusted publishing, passes nothing.
        required: false

jobs:
  release:
    # Only a merged `release/*` PR is a release. A closed-unmerged one, or any
    # other branch reaching main, is not.
    # `hotfix/` as well as `release/` — and THIS is the gate that decides it,
    # not the caller's (found live on a target's hotfix). Every stub is a `uses:`
    # call, and a called workflow evaluates its own job `if:` against the
    # CALLER's event context. So teaching the four stubs about `hotfix/`
    # without changing this line left them all inert: a merged hotfix passed
    # the stub's condition, called this workflow, and was skipped here —
    # zero jobs, no tag, no Release, no publish, and a green check either way.
    if: >-
      github.event.pull_request.merged == true &&
      (startsWith(github.event.pull_request.head.ref, 'release/') ||
       startsWith(github.event.pull_request.head.ref, 'hotfix/'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Shallow on purpose: this job reads package.json and CHANGELOG.md at
      # HEAD, and `gh release create` tags server-side — nothing walks
      # history (ops#571). No persisted credential: every write below goes
      # through `gh` with GITHUB_TOKEN in its environment, and the caller's
      # build_command runs in a tree that holds no token.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ inputs.node_version }}
          # Only cache when there is a build to speed up: a target with no
          # build_command may not keep a lockfile, and setup-node hard-fails
          # on `cache: npm` when it cannot find one. Empty string = no cache.
          cache: ${{ inputs.build_command != '' && 'npm' || '' }}
          registry-url: ${{ inputs.npm_registry_url }}
          scope: ${{ inputs.npm_scope }}

      - name: Build release artifacts
        if: inputs.build_command != ''
        run: ${{ inputs.build_command }}
        env:
          # The token `registry-url` above expects, for a caller whose
          # build_command installs a GitHub Packages dependency. Not live
          # today — no caller passes both a build_command and a private dep —
          # but it is one config change away, and it is exactly how
          # _reusable-release-pr.yml failed six consecutive runs in silence
          # (ops#652).
          #
          # Only effective if the CALLER also grants `packages: read`. Two
          # rules together decide the effective grant, and knowing only the
          # first is how the paired workflow shipped broken:
          #
          #   1. The caller's `permissions:` is the CEILING — a called
          #      workflow can drop scopes but never add them. A stub with
          #      `contents: write` alone still gets 401 here.
          #   2. A callee's own `permissions:` block SETS the grant within
          #      that ceiling rather than merging into it. This file has no
          #      `permissions:` key, which is why the caller's grant reaches
          #      this step at all — adding one here would silently narrow
          #      every caller (the ops#529 outage: `_reusable-node-ci.yml`
          #      gained `packages: read` and every caller granting less
          #      hard-failed at startup_failure with zero jobs).
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          # The release branch name is stable (`release/next`), so the version
          # comes from package.json at the merge commit, never from the ref.
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # A hotfix merges straight into main without going through
          # release-pr.yml, so nothing bumped package.json — the version is
          # whatever the last release set (ops#637). Cutting a Release for a
          # tag that already exists fails the job and leaves a red run on a
          # deploy that actually succeeded, which is the wrong signal on the
          # one path taken when something is already broken.
          #
          # Skip instead. The hotfix still reaches main and still deploys; it
          # simply rides in the NEXT release's notes, which is where an
          # unbumped change belongs. A hotfix that should carry its own
          # version bumps package.json and CHANGELOG.md in the PR, and then
          # this step sees a new version and cuts it normally.
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::notice::v$VERSION is already released — no version bump in this merge, so there is nothing to tag. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract changelog notes
        if: steps.version.outputs.skip != 'true'
        id: notes
        run: |
          # `next` after setting p=1 skips printing the heading line itself —
          # the release already carries it via --title, so the body only
          # needs the section content beneath it (ops#484: without `next` the
          # heading printed twice).
          # `###? ` followed by a version, NOT a bare `/^## /`:
          # conventional-changelog's own headerPartial is `## ` today, but the
          # preset here overrides only types/transform/formatDate — never
          # writer.headerPartial — so the heading level is the preset's to
          # change, and a `###` patch heading would silently make this read the
          # PREVIOUS version's notes. Requiring a version token after the
          # hashes also means `### Bug Fixes` can never be mistaken for a
          # release heading, at either level (Evaluator, ops#412).
          # Two hashes plus an optional third, NOT the `#{2,3}` interval that
          # says the same thing: mawk 1.3.4 20240123 ignores an interval's
          # upper bound and matches `##` only, so a `###` heading extracted
          # nothing at all (ops#921). `?` is portable across every awk.
          NOTES=$(awk '/^###? \[?v?[0-9]/{if(p) exit; p=1; next} p' CHANGELOG.md)
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$NOTES"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ steps.notes.outputs.notes }}
          VERSION: ${{ steps.version.outputs.version }}
          ASSETS: ${{ inputs.release_assets }}
          # The merge commit on main, so the tag lands on what was released
          # and not on the default branch's head, which `gh release create`
          # would tag otherwise (wrong for a repo whose default branch is
          # `develop`, and a race for any other).
          TARGET: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          # $ASSETS is deliberately unquoted — it is a glob that must expand to
          # the built artifacts, and it is repo config from the caller's stub,
          # not user input. Empty expands to nothing, which is the no-asset case.
          # shellcheck disable=SC2086
          gh release create "v$VERSION" \
            --target "$TARGET" \
            --title "v$VERSION" \
            --notes "$NOTES" \
            $ASSETS

      # The floating major tag, for a repo whose workflows other repos `uses:`
      # by tag: `v1` follows every v1.x.y release, so a caller written `@v1`
      # picks a fix up on release with no PR of its own, and a breaking change
      # is a new major the caller moves to on purpose. Moved by force, never
      # deleted and recreated, so a `uses:` resolving it mid-move still finds
      # it. Only when the caller opts in: a tag nobody resolves is noise.
      - name: Move the floating major tag
        if: steps.version.outputs.skip != 'true' && inputs.floating_major_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          MAJOR="v${VERSION%%.*}"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$MAJOR" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$MAJOR" \
              -f sha="$TARGET" -F force=true >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$MAJOR" -f sha="$TARGET" >/dev/null
          fi
          echo "$MAJOR -> $TARGET (v$VERSION)"

      - name: Publish package
        if: >-
          steps.version.outputs.skip != 'true' &&
          inputs.npm_registry_url != ''
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ops#1358, #16, #18. Publishes the .vsix the Release above carries to the VS
  # Code Marketplace and to Open VSX, downloaded from that Release by version
  # so each listing is byte-identical to the attachment. Chained by `needs:` in this same run, not
  # a separate workflow on `release: published`, for the GITHUB_TOKEN
  # recursion reason at the top of this file.
  #
  # Its own job, and NOT gated on the release job's `skip` (#16). It was a
  # step after `gh release create` behind that gate, so a failed publish left
  # the Release behind and a re-run saw it, skipped, and never retried. Now a
  # re-run, of the failed jobs or of all of them, reaches this job either way:
  # a release job that re-runs finds the Release made, skips, and this job
  # still publishes that Release's .vsix. `--skip-duplicate` (vsce and ovsx
  # both have it) makes a version already on a registry a green no-op, so a
  # retry after a partial success, or a hotfix that bumped nothing, is never
  # red for that alone; any other failure is.
  #
  # The two registries are independent: each publishes or says why not, one
  # failing never skips the other, and the step fails at the end if either
  # did. Each tool sees only its own token.
  #
  # Which repo publishes is the caller's `marketplace_packages` input: this
  # file is public and shared across repos, so it carries no per-repo table.
  # A caller passing nothing never starts the job. "No token yet" is gated
  # INSIDE the step, not in an `if:` — a secret in an `if:` skips with no log
  # line — and says so in a notice per registry, so the day a token lands it
  # is visible that publishing started.
  #
  # Each token reaches the step through the caller's named `secrets:` entry
  # and its tool reads it from the environment (`VSCE_PAT`, `OVSX_PAT`), so
  # no token is ever on a command line. vsce is pinned to an exact 3.x, the
  # major the fleet's extension packages with, and ovsx to an exact version.
  #
  # #22. With no `OVSX_PAT`, a caller granting `id-token: write` publishes to
  # Open VSX by trusted publishing instead: no stored secret. Open VSX matches
  # its registration on the ID token's `workflow_ref`, the caller's stub, so
  # the stub's filename is what gets registered. The grant is the caller's
  # alone: this file still has no `permissions:` key (see the release job).
  marketplace:
    needs: release
    if: inputs.marketplace_packages != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ inputs.node_version }}

      - name: Publish to the VS Code Marketplace and Open VSX
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
          PACKAGES: ${{ inputs.marketplace_packages }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          # Set by the runner only when the caller grants `id-token: write`.
          OIDC="${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          if [ -z "$VSCE_PAT" ] && [ -z "$OVSX_PAT" ] && [ -z "$OIDC" ]; then
            echo "::notice::Marketplace publish skipped: no VSCE_PAT or OVSX_PAT secret, and no id-token: write, on $REPO."
            exit 0
          fi
          DIR=$(mktemp -d)
          gh release download "v$VERSION" --repo "$REPO" --dir "$DIR"
          cd "$DIR"
          FAILED=""
          # $PACKAGES is deliberately unquoted below: a glob from the caller's input.
          if [ -z "$VSCE_PAT" ]; then
            echo "::notice::VS Code Marketplace publish skipped: no VSCE_PAT secret on $REPO."
          else
            # shellcheck disable=SC2086
            env -u OVSX_PAT npx --yes @vscode/vsce@3.9.2 publish --skip-duplicate --packagePath $PACKAGES \
              || FAILED="$FAILED VS-Code-Marketplace"
          fi
          if [ -n "$OVSX_PAT" ]; then
            # shellcheck disable=SC2086
            env -u VSCE_PAT npx --yes ovsx@1.3.0 publish --skip-duplicate --packagePath $PACKAGES \
              || FAILED="$FAILED Open-VSX"
          elif [ -n "$OIDC" ]; then
            # #22: trusted publishing, the run's OIDC ID token traded for a
            # short-lived publishing token; the flag fails rather than falls
            # back when the exchange does.
            # shellcheck disable=SC2086
            env -u VSCE_PAT npx --yes ovsx@1.3.0 publish --trusted-publishing --skip-duplicate --packagePath $PACKAGES \
              || FAILED="$FAILED Open-VSX"
          else
            echo "::notice::Open VSX publish skipped: no OVSX_PAT secret, and no id-token: write, on $REPO."
          fi
          if [ -n "$FAILED" ]; then
            echo "::error::Publish failed:$FAILED"
            exit 1
          fi
