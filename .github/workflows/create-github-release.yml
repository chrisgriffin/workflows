name: Create GitHub Release

# Thin trigger stub, the same one every repo in the fleet carries: the body is
# this repo's own _reusable-create-github-release.yml, called at `develop`.
# When the `release/next` PR merges into main it tags the merge commit
# `vX.Y.Z`, cuts that version's CHANGELOG section into a GitHub Release, and
# moves the floating `vX` tag onto it, which is the ref every caller's
# `uses: chrisgriffin/workflows/...@v1` resolves. Nothing to build or
# publish: the workflows are the release.

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  release:
    # `merged == true` here keeps a closed-unmerged PR from reaching the
    # call at all; which branches cut a release is the called workflow's.
    if: github.event.pull_request.merged == true
    # The caller's grant is the ceiling: the Release, its tag and the
    # floating major tag are all contents writes.
    permissions:
      contents: write
    uses: chrisgriffin/workflows/.github/workflows/_reusable-create-github-release.yml@develop
    with:
      floating_major_tag: true
